<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEXTRAW — Игры</title><link rel="stylesheet" href="style.css"></head><body><div id="appHeader"></div><main class="page">
<div class="page-head"><div><label>ARCADE LIBRARY</label><h1>Выбирай игру<span>.</span></h1><p class="lead">Шесть встроенных мини-игр доступны сразу. Для общих пользовательских игр сервер Netlify должен быть настроен. Для клавиатуры используй стрелки или WASD.</p></div><a class="btn" href="studio.html">＋ Создать игру</a></div>
<div class="catalog-tools"><input id="gameSearch" placeholder="⌕ Найти игру..."><select id="gameFilter"><option>Все категории</option><option>Аркада</option><option>Логика</option><option>Реакция</option><option>Мои игры</option></select><label class="upload-btn">↑ Загрузить HTML-файл<input type="file" id="importGame" accept=".html,.htm,text/html" hidden></label></div>
<div id="gameGrid" class="game-grid"></div><section class="section"><div class="section-title"><div><label>YOUR PROJECTS</label><h2>Свои игры</h2></div><a class="text-link" href="studio.html">Редактировать проекты →</a></div><div id="projectGrid" class="game-grid"></div></section>
</main>
<div class="modal" id="playModal"><div class="modal-shell play-shell"><div class="modal-top"><div><label id="playCategory">GAME</label><h2 id="playTitle">Игра</h2></div><div class="modal-top-actions"><button id="restartGame" class="btn">↻ Перезапустить</button><button class="icon-close" data-close="playModal">✕</button></div></div><p id="playHelp" class="muted"></p><div id="playArea" class="play-area"></div><div class="play-bottom"><span id="playStatus">Готов к игре</span><button class="btn" data-close="playModal">Закрыть игру</button></div></div></div>
<div id="appFooter"></div><script src="common.js"></script><script src="games.js"></script></body></html>
